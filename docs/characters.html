<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キャラ図鑑</title>
<!--
  ゲームに出るキャラの絵を一覧で見るページ (主人公・仲間・ダンジョンごとの敵とボス・どこにでも出る敵・ライバル探検隊・段階 9 の案)。
  ダブルクリックで開ける。絵とデータは ゲームと同じ js/ のファイルから読む (段階 9 の案だけは このページに表を持つ)。
  ?section=aso のように書くと、その章だけ出す (確認用)
-->
<style>
    :root {
        --bg: #10162a; --card: #1b2440; --line: #2c3a62; --text: #e8f0ff; --sub: #9aa8c8; --gold: #ffd84a; --plan: #ff9ab0;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    h2 { font-size: 18px; margin: 36px 0 6px; border-left: 4px solid var(--gold); padding-left: 8px; scroll-margin-top: 56px; }
    h2 .plan, .tag.plan { color: #10162a; background: var(--plan); font-size: 12px; padding: 1px 8px; border-radius: 99px; margin-left: 6px; vertical-align: 2px; }
    h3 { font-size: 15px; margin: 18px 0 0; color: var(--sub); }
    p { color: var(--sub); margin: 4px 0; font-size: 14px; line-height: 1.6; }
    nav { position: sticky; top: 0; z-index: 1; background: rgba(16, 22, 42, 0.95); padding: 8px 0; margin: 10px 0 0; display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
    nav a { color: var(--text); text-decoration: none; font-size: 13px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--card); }
    nav a:hover { border-color: var(--gold); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 10px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px; }
    .card.plan { border-color: #6a3a5a; }
    .pics { display: flex; align-items: flex-end; justify-content: center; gap: 6px; height: 104px; padding-bottom: 8px; background: #0b1020; border-radius: 6px; }
    .big .pics { height: 150px; }
    .pics canvas { image-rendering: pixelated; }
    .pics .from { opacity: 0.75; }
    .arrow { color: var(--gold); font-size: 18px; align-self: center; }
    .head { display: flex; align-items: baseline; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .no { color: var(--sub); font-size: 12px; }
    .name { font-weight: bold; font-size: 16px; }
    .tags { display: flex; gap: 4px; margin: 6px 0 4px; flex-wrap: wrap; }
    .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; color: #10162a; font-weight: bold; }
    .tag.plain { background: #3a4670; color: var(--text); font-weight: normal; }
    .tag.boss { background: var(--gold); }
    .desc { font-size: 12px; color: var(--sub); line-height: 1.5; }
    .line { font-size: 12px; margin-top: 4px; }
    .tag.star { background: #ffe9a0; }
    .evo { font-size: 12px; color: #ffe680; margin-top: 4px; }
    .ally { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
    .ally-title { font-size: 11px; color: var(--sub); margin-bottom: 4px; }
    .bars { display: grid; grid-template-columns: 52px 1fr 26px; gap: 2px 6px; align-items: center; font-size: 11px; color: var(--sub); }
    .bar { height: 6px; background: #0b1020; border-radius: 3px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: #7fd3f7; border-radius: 3px; }
    .bar i.hi { background: #ffd84a; }
    .learn { margin-top: 6px; font-size: 11px; line-height: 1.7; }
    .learn span { display: inline-block; margin-right: 6px; white-space: nowrap; }
    .learn .lv { color: var(--sub); }
    .learn .own { color: #ffb0c8; font-weight: bold; }
    .learn .gen { color: #9ad8ff; }
    /* 説明 (js/profiles.js。前作の スロット・パチンコの 図鑑を もとに した) */
    .prof { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 12px; line-height: 1.6; }
    .prof b { display: block; color: var(--gold); margin-bottom: 2px; }
    .prof p { margin: 0 0 6px; white-space: pre-line; }
</style>
</head>
<body>
<main>
    <h1>キャラ図鑑</h1>
    <p>ゲームに出るキャラの絵です。ゲームと同じ絵を大きくして描いています（動いているのは待機のアニメーション）。</p>
    <p>仲間になれるキャラには、仲間のときの ★・役職・能力の振り分け（Lv30 のとき。<span style="color:#ffd84a">黄色</span>は とくに高い能力）・覚えるわざ を出しています。
        わざは <span style="color:#ffb0c8;font-weight:bold">ピンク＝そのキャラだけの わざ</span>・<span style="color:#9ad8ff">水色＝役職・属性の汎用わざ</span>（かっこの中は その役職・属性）・白＝敵のときの わざ。</p>
    <p>前作（スロット・パチンコ）に 出た キャラには、前作の 図鑑の 説明を もとにした 説明を のせています（js/profiles.js）。</p>
    <nav id="nav"></nav>
    <div id="sections"></div>
</main>

<script src="../js/rng.js?v=d477476e"></script>
<script src="../js/dungeon.js?v=00a347e2"></script>
<script src="../js/units.js?v=61fa43f8"></script>
<script src="../js/enemies.js?v=64281f04"></script>
<script src="../js/items.js?v=2dc93420"></script>
<script src="../js/dungeons.js?v=87bf375c"></script>
<script src="../js/collection.js?v=60fb5715"></script>
<script src="../js/allies.js?v=705b2a4c"></script>
<script src="../js/enemies9.js?v=9dffc81b"></script>
<script src="../js/enemies10.js?v=5cfe54c6"></script>
<script src="../js/enemies11.js?v=4cd5c7ea"></script>
<script src="../js/art.js?v=8d1ac01c"></script>
<script src="../js/bigart.js?v=8b50860b"></script>
<script src="../js/enemyart.js?v=4369f873"></script>
<script src="../js/enemyart9.js?v=9ce94360"></script>
<script src="../js/enemyart10.js?v=462eb5f0"></script>
<script src="../js/specials.js?v=08493e43"></script>
<script src="../js/profiles.js?v=ffed189e"></script>
<script src="../js/enemyart11.js?v=959ce57f"></script>
<script>
(function () {
    'use strict';
    const { Units: U, Dungeons: DG, Collection: C, Art: A, BigArt: B, EnemyArt9: E } = KD;
    // 属性の色 (game.js の ELEMENT_COLORS と同じ)
    const ELEMENT_COLORS = { 'こおり': '#bff0ff', 'ほのお': '#ff9a4a', 'みず': '#6ab8ff', 'しぜん': '#9ae07a', 'かぜ': '#e8f4ff', 'ふしぎ': '#d8a8ff', 'ふつう': '#ffffff' };
    const AI = { approach: '近づく', shoot: '撃つ', flee: 'にげる', wait: 'まつ' };
    // とくちょう (enemies.js の traits)
    const TRAITS = {
        ghost: '壁の中を通れる', swim: '水の上を歩ける', lava: '溶岩でダメージを受けない', shell: 'ダメージを受けると甲羅にこもる',
        rage: '攻撃されると こうげきが上がる', berserk: 'HP が半分を切ると強くなる', split: '攻撃されると分裂する',
        disguise: '近くに来るまで道具に化けている', mimic: '宝箱に化けている', caltrops: '歩いたあとに まきびし',
        explode: 'HP が少なくなると爆発', healer: '仲間の敵を回復', evasive: '攻撃が当たりにくい', frenzy: 'しばらくすると凶暴に',
        revive: '1 回だけ復活', slow: '2 ターンに 1 回しか動かない', charge: '2 回に 1 回 強い攻撃', reflect: 'わざをはね返すことがある',
        summon: '仲間を呼ぶ', group: '何体かまとまって出る', stealMoney: 'お金を取って逃げる', malfunction: 'ときどき故障して止まる',
        rich: 'たおすと たくさんのお金', warp: '攻撃されると どこかへ飛ぶ', treasure: 'たおすと 良い道具', metal: 'ダメージが 1〜2 しか通らない・すぐ逃げる'
    };
    const skillName = id => (U.SKILLS[id] ? U.SKILLS[id].name : id);
    const AL = KD.Allies;
    const GENERIC_ROLE = Object.fromEntries(Object.entries(AL.GENERIC).flatMap(([role, ids]) => ids.map(id => [id, role])));
    // 属性の 汎用わざ (2026-10-22)
    const GENERIC_ELEMENT = Object.fromEntries(Object.entries(AL.ELEMENT_SKILLS || {}).flatMap(([el, ids]) => ids.map(id => [id, el])));
    // 敵のときに使う わざ (白で出す)
    const ENEMY_MOVES = new Set(Object.values(U.ENEMIES).flatMap(e => (e.moves || []).map(([m]) => m)).concat(Object.values(U.ENEMIES).map(e => e.move).filter(Boolean)));
    // 仲間のときの ★・役職・能力 (Lv30)・覚えるわざ
    function allyInfo(kind) {
        const star = AL.star(kind);
        if (!star) return null;
        const role = AL.roleOf(kind);
        const st = U.allyStats(kind, 30, role);
        const learn = AL.learnList(kind).map(([lv, id]) => {
            const g = GENERIC_ROLE[id];
            const el = GENERIC_ELEMENT[id];
            const cls = g || el ? 'gen' : ENEMY_MOVES.has(id) && !U.HEROES[kind] ? '' : 'own';
            return { lv, name: skillName(id) + (g && g !== role ? `（${U.ROLES[g].name}）` : el ? `（${el}）` : ''), cls };
        });
        return { star, role, st, learn };
    }

    // ----- 敵のデータ → カードの中身 -----
    function enemyCard(id, extra = {}) {
        const d = U.ENEMIES[id];
        const moves = (d.moves || []).map(([m]) => skillName(m));
        if (d.move && !moves.length) moves.push(skillName(d.move));
        const traits = (d.traits || []).filter(t => !(t === 'swim' && d.element === 'みず') && !(t === 'lava' && d.element === 'ほのお')).map(t => TRAITS[t] || t);
        if (d.speed === 2) traits.unshift('1 ターンに 2 回動く');
        if (d.steal) traits.push('道具をぬすんで逃げる');
        const tags = [AI[d.ai] || d.ai];
        if (AL.star(id)) tags.push(`仲間: ${U.ROLES[AL.roleOf(id)].name}`);
        // 進化 (enemies9.js の EVOLVE): 元の敵には 進化の条件、進化形には どうやって進化するか
        const from = Object.keys(AL.EVOLVE || {}).find(k => AL.EVOLVE[k].to === id);
        const evo = AL.EVOLVE && AL.EVOLVE[id] ? `進化：${AL.evolveText(id)}` : from ? `${U.ENEMIES[from].name}から 進化：${AL.evolveText(from).replace(/ \S+に 進化$/, '')}` : '';
        return {
            id, no: d.no, name: d.name, element: d.element, tags, boss: d.boss, evo,
            desc: [moves.length ? `わざ: ${moves.join('・')}` : '', traits.join('。')].filter(Boolean).join('　'),
            line: d.line, ...extra
        };
    }
    function heroCard(id) {
        const h = U.HEROES[id];
        const lines = C.LINES[id];
        const learn = (h.learn || []).map(([, s]) => skillName(s));
        return {
            id, no: '', name: h.name, element: h.element, tags: [h.type || (U.ROLES[h.role] && U.ROLES[h.role].name) || ''].filter(Boolean),
            leader: false,
            desc: [h.note || '', learn.length ? `わざ: ${learn.join('・')}` : ''].filter(Boolean).join('　'),
            line: lines ? lines.attack[0] : ''
        };
    }

    // ----- 章 -----
    const SECTIONS = [];
    const section = (id, title, note, groups, plan = false) => SECTIONS.push({ id, title, note, groups, plan });
    section('heroes', '主人公・仲間', '主人公は こおりくん か おにおに。やすさん・たむさん・だけさんは ストーリーで仲間になる',
        [{ cards: ['koori', 'onioni', 'yasu', 'tamu', 'dake'].map(heroCard) }]);
    // SEタウンの人 (前作と 同じ 絵。2026-10-22)
    section('town', 'SEタウンの人', '町の 施設に いる。町の 道を 歩いていると 向かい側から 来ることも ある',
        [{ cards: [{ id: 'furukawa', name: 'ふるカワ', tags: ['探検隊ギルド'] }, { id: 'tomoishi', name: 'ともいし', tags: ['お店'] }].map(c => ({ no: '', desc: '', ...c })) }]);
    DG.LIST.forEach((d, i) => {
        const groups = [{ title: '敵', cards: d.enemies.map(id => enemyCard(id)) }];
        if (d.rare && d.rare.length) groups.push({ title: 'まれに出る強敵', cards: d.rare.map(id => enemyCard(id)) });
        groups.push({ title: `ボス（${d.floors} 階）`, cards: [enemyCard(d.boss)] });
        section(d.id, `${i + 1}. ${d.name}`, `${d.floors} 階`, groups);
    });
    // 段階 10 の ダンジョン (コード塔・ツモツモ横丁・ハリー王国)
    (DG.EXTRA || []).forEach(d => {
        const groups = [{ title: '敵', cards: d.enemies.map(id => enemyCard(id)) }];
        if (d.rare && d.rare.length) groups.push({ title: 'まれに出る', cards: [...new Set(d.rare)].map(id => enemyCard(id)) });
        groups.push({ title: `ボス（${d.floors} 階）`, cards: [enemyCard(d.boss)] });
        section(d.id, d.name, `${d.floors} 階・${d.openText}`, groups);
    });
    section('naitei', 'ナイテイの きょうだい', 'ごくまれに 掲示板に出る クエストで 決まった階に 待っている。たおすと 仲間になる',
        [{ cards: Object.keys(DG.RARE_QUESTS || {}).map(id => enemyCard(id, { desc: `${DG.byId(DG.RARE_QUESTS[id].dungeon).name}の B${DG.RARE_QUESTS[id].floor}F で 待っている` })) }]);
    // バージョン限定 (氷隊 / 鬼鬼団): 専用クエストだけの キャラと 限定ボスの 再戦
    if (DG.VERSION_QUESTS) Object.entries(DG.VERSIONS).forEach(([v, info]) => {
        section(`ver-${v}`, `${info.name}の 専用クエスト`, `${info.name}（${v === 'koori' ? 'こおりくん' : 'おにおに'}を えらんだとき）だけ。たおして 報告すると 仲間になる（★5）`,
            [{ cards: DG.VERSION_QUESTS[v].filter(q => q.ally).map(q => enemyCard(q.ally, { desc: `${DG.byId(q.dungeon).name}の B${q.floor}F で 待っている` })) }]);
    });
    section('anywhere', 'どこにでも出る（まれ）', 'どのダンジョンにも まれに出る', [{ cards: DG.ANYWHERE.map(([id]) => enemyCard(id)) }]);
    section('rivals', 'ライバル探検隊', 'ハプニングで鉢合わせする。たおすと お金を落とす。ストーリーをクリアすると 専用クエストで仲間になる。メンバーが そろうと リーダーとの勝負（リーダーは ★5、ほかは ★4）',
        Object.entries(C.RIVALS).map(([team, ids]) => ({ title: team, cards: ids.map(id => enemyCard(id, id === AL.LEADERS[team] ? { tags: [...enemyCard(id).tags, 'リーダー'] } : {})) })));
    // 段階 9: ドタバタ大迷宮 (借金を返し切ったあとの おまけダンジョン)
    const B9 = Object.keys(U.ENEMIES).filter(k => Number(U.ENEMIES[k].no) >= 53);
    section('bonus', 'ドタバタ大迷宮', '借金を返し切ったあとの おまけダンジョン（99 階）。進化形は「元の敵 ▶ 進化形」', [
        { title: 'ボス（99 階）', cards: [enemyCard('maoushin', { desc: 'HP が減ると 四天王（ダイシ・ズミタニ・ルナヤ・ノゾエマ）を 1 人ずつ呼ぶ' })] },
        { title: '進化形（053〜079）', cards: B9.filter(k => Number(U.ENEMIES[k].no) <= 79).map(k => enemyCard(k)) },
        { title: 'ドタバタ大迷宮の敵（080〜092）', cards: B9.filter(k => Number(U.ENEMIES[k].no) >= 80).map(k => enemyCard(k)) }
    ]);

    // ----- 描く -----
    const sprites = [];   // { canvas, id, scale, h }
    const BOX = 92;       // 絵の高さの上限 (ドット × 倍率)
    function makeCanvas(id, max = BOX) {
        const sp = A.SPRITES[id] && A.SPRITES[id].frames[0];
        const size = sp ? { w: sp[0].length, h: sp.length } : B.BIG[id];
        const scale = Math.max(1, Math.min(5, Math.floor(max / size.h)));
        const c = document.createElement('canvas');
        c.width = size.w * scale;
        c.height = size.h * scale;
        sprites.push({ canvas: c, id, scale, h: size.h });
        return c;
    }
    function draw(s, frame) {
        const ctx = s.canvas.getContext('2d');
        ctx.clearRect(0, 0, s.canvas.width, s.canvas.height);
        if (A.SPRITES[s.id]) A.drawSprite(ctx, s.id, frame, 0, 0, { scale: s.scale });
        else B.drawBig(ctx, s.id, frame, s.canvas.width / 2, s.canvas.height, { height: s.h * s.scale });
    }
    const hasArt = id => Boolean(A.SPRITES[id] || B.BIG[id]);

    const STAT_LABELS = [['hp', 'HP'], ['atk', 'こうげき'], ['def', 'ぼうぎょ'], ['spa', 'とくこう'], ['spd', 'とくぼう']];
    // 説明 (前作の 図鑑から)。段落ごとに 分ける
    function profileHtml(id) {
        const pr = (KD.Profiles || {})[id];
        if (!pr) return '';
        const esc = t => t.replace(/[&<>]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[ch]);
        return `<div class="prof"><b>${esc(pr.title)}</b>${pr.text.split('\n\n').map(p => `<p>${esc(p)}</p>`).join('')}</div>`;
    }
    // 必殺技 (js/specials.js。仲間に なれる キャラ・主人公たち)
    function specialHtml(c) {
        if (!KD.Specials || !(U.HEROES[c.id] || AL.star(c.id))) return '';
        const e = U.ENEMIES[c.id] || U.HEROES[c.id];
        const sp = KD.Specials.of(c.id, { element: e.element, role: (U.HEROES[c.id] && U.HEROES[c.id].role) || AL.roleOf(c.id), line: (U.ENEMIES[c.id] || {}).line });
        return `<div class="evo">必殺技：${sp.name}</div>`;
    }
    function allyHtml(info) {
        if (!info) return '';
        const max = { hp: 260, atk: 130, def: 130, spa: 130, spd: 130 };   // 棒の長さの目安 (Lv30。HP 以外は同じ基準)
        const top = Math.max(...STAT_LABELS.slice(1).map(([k]) => info.st[k] / max[k]));
        const bars = STAT_LABELS.map(([k, label]) => {
            const r = Math.min(1, info.st[k] / max[k]);
            const hi = k !== 'hp' && info.st[k] / max[k] >= top * 0.999;
            return `<span>${label}</span><span class="bar"><i class="${hi ? 'hi' : ''}" style="width:${Math.round(r * 100)}%"></i></span><span>${info.st[k]}</span>`;
        }).join('');
        const learn = info.learn.map(l => `<span><span class="lv">Lv${l.lv}</span> <span class="${l.cls}">${l.name}</span></span>`).join('');
        return `<div class="ally"><div class="ally-title">仲間のとき（Lv30）</div><div class="bars">${bars}</div><div class="learn">${learn}</div></div>`;
    }

    function renderCard(c, parent) {
        const info = c.plan ? null : allyInfo(c.id);
        const el = document.createElement('div');
        const big = !A.SPRITES[c.id] && B.BIG[c.id] && B.BIG[c.id].h > 20;
        el.className = 'card' + (c.plan ? ' plan' : '') + (big ? ' big' : '');
        const pics = document.createElement('div');
        pics.className = 'pics';
        const max = big ? 136 : BOX;
        const base = E.EVOLVED[c.id];
        if (base && hasArt(base)) {
            const from = makeCanvas(base, base === 'maou' ? 60 : 50);
            from.className = 'from';
            pics.append(from);
            pics.insertAdjacentHTML('beforeend', '<span class="arrow">▶</span>');
        }
        if (hasArt(c.id)) pics.append(makeCanvas(c.id, max));
        el.append(pics);
        const baseName = base && U.ENEMIES[base] ? U.ENEMIES[base].name : null;
        el.insertAdjacentHTML('beforeend', `
            <div class="head"><span class="no">${c.no ? 'No.' + c.no : ''}</span><span class="name">${c.name}</span></div>
            <div class="tags">${c.element ? `<span class="tag" style="background:${ELEMENT_COLORS[c.element] || '#ffffff'}">${c.element}</span>` : ''}
                ${info ? `<span class="tag star">${'★'.repeat(info.star)}</span>` : ''}
                ${c.boss ? '<span class="tag boss">ボス</span>' : ''}
                ${c.tags.filter(t => t !== 'ボス').map(t => `<span class="tag plain">${t}</span>`).join('')}
                ${baseName ? `<span class="tag plain">元: ${baseName}</span>` : ''}</div>
            <div class="desc">${c.desc || ''}</div>
            ${c.evo ? `<div class="evo">${c.evo}</div>` : ''}
            ${specialHtml(c)}
            ${c.line ? `<div class="line">「${c.line}」</div>` : ''}
            ${allyHtml(info)}
            ${profileHtml(c.id)}`);
        parent.append(el);
    }

    const only = new URLSearchParams(location.search).get('section');
    const nav = document.getElementById('nav');
    const root = document.getElementById('sections');
    SECTIONS.filter(s => !only || s.id === only).forEach(s => {
        nav.insertAdjacentHTML('beforeend', `<a href="#${s.id}">${s.title.replace(/^\d+\. /, '')}${s.plan ? '（案）' : ''}</a>`);
        root.insertAdjacentHTML('beforeend', `<h2 id="${s.id}">${s.title}${s.plan ? '<span class="plan">案</span>' : ''}</h2><p>${s.note}</p>`);
        s.groups.forEach(g => {
            if (g.title) root.insertAdjacentHTML('beforeend', `<h3>${g.title}</h3>`);
            const grid = document.createElement('div');
            grid.className = 'grid';
            g.cards.forEach(c => renderCard(c, grid));
            root.append(grid);
        });
    });

    let frame = 0;
    const tick = () => { sprites.forEach(s => draw(s, frame)); frame = 1 - frame; };
    tick();
    setInterval(tick, 450);
})();
</script>
</body>
</html>
