<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>敵 053〜092 の絵（案）</title>
<!--
  段階 9 (案) の敵の絵を一覧で見るページ (敵キャラ表 9・10 章)。ダブルクリックで開ける。
  絵は ゲームと同じ js/enemyart9.js で描く。進化形は「元の敵 → 進化形」を並べる。
-->
<style>
    :root {
        --bg: #10162a; --card: #1b2440; --line: #2c3a62; --text: #e8f0ff; --sub: #9aa8c8; --gold: #ffd84a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-size: 22px; margin: 0 0 6px; }
    h2 { font-size: 18px; margin: 32px 0 6px; border-left: 4px solid var(--gold); padding-left: 8px; }
    p { color: var(--sub); margin: 4px 0; font-size: 14px; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-top: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px; }
    .pics { display: flex; align-items: center; justify-content: center; gap: 6px; height: 104px; background: #0b1020; border-radius: 6px; }
    .pics canvas { image-rendering: pixelated; }
    .pics .from { opacity: 0.75; }
    .arrow { color: var(--gold); font-size: 18px; }
    .head { display: flex; align-items: baseline; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .no { color: var(--sub); font-size: 12px; }
    .name { font-weight: bold; font-size: 16px; }
    .tags { display: flex; gap: 4px; margin: 6px 0 4px; flex-wrap: wrap; }
    .tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; color: #10162a; font-weight: bold; }
    .tag.plain { background: #3a4670; color: var(--text); font-weight: normal; }
    .desc { font-size: 12px; color: var(--sub); line-height: 1.5; }
    .line { font-size: 12px; margin-top: 4px; }
    .boss .pics { height: 180px; }
</style>
</head>
<body>
<main>
    <h1>敵 053〜092 の絵（案）</h1>
    <p>段階 9（おまけダンジョン「ドタバタ大迷宮」）の敵です。絵はゲームと同じものを、5 倍の大きさで描いています（動いているのは待機のアニメーション）。</p>
    <p>進化形は「元の敵 → 進化形」の順に並べています。元の絵の色を変えて、王冠・角・炎などの しるしを足しました。</p>

    <h2>大魔王ASO・真（99 階のボス）</h2>
    <div class="grid" id="boss"></div>

    <h2>進化形（053〜079）</h2>
    <div class="grid" id="evolved"></div>

    <h2>ドタバタ大迷宮の敵（080〜092）</h2>
    <div class="grid" id="native"></div>
</main>

<script src="../js/art.js"></script>

        ['064', 'spamking', 'スパムキング', 'ふしぎ', '★3', '近づく', '攻撃されると分裂する', '100万人目の お客様です！'],
        ['065', 'hitodamaou', 'ヒトダマオウ', 'ほのお', '★4', '撃つ', '火の玉（直線）。やけど', 'めら～り'],
        ['066', 'jouninman', 'ジョウニンマン', 'かぜ', '★4', '近づく', '1ターンに 2 回動く', 'もう いましたよ～'],
        ['067', 'kagebunshin', 'カゲブンシンダヌキ', 'ふしぎ', '★4', 'まつ', '道具に化ける。攻撃されると どこかへ飛ぶ', 'ドロロン！'],

        ['084', 'kaendaruma', 'カエンダルマ', 'ほのお', '★4', '近づく', 'HP が減ると爆発する', '七転び 八起き 大爆発！'],
        ['085', 'youganworm', 'ヨウガンワーム', 'ほのお', '★4', '近づく', '溶岩の上を 歩ける。やけど', 'ズズズ…'],
        ['086', 'mandoragon', 'マンドラゴン', 'しぜん', '★4', 'まつ', '叫び声で 周り 8 マスを こんらん', 'ギャアアア！（抜かないで）'],
        ['087', 'obakekabocha', 'オバケカボチャ', 'しぜん', '★4', 'すりぬけ', '壁をすりぬける', 'トリック オア トリート！'],
        ['088', 'haetorigusan', 'ハエトリグサーン', 'しぜん', '★4', 'まつ', '近づくと すいこみ（強い攻撃）', 'パクッ'],
        ['089', 'kokemusha', 'コケムシャ', 'しぜん', '★5', '近づく', 'HP が半分を切ると 強くなる', '百年 こけむして 待っておった'],
        ['090', 'tatsumakitsune', 'タツマキツネ', 'かぜ', '★4', '近づく', '攻撃されると どこかへ飛ぶ。1ターンに 2 回動く', 'コーン！（ぐるぐる）'],
        ['091', 'kaminarigumo', 'カミナリグモ', 'かぜ', '★5', '撃つ', '雷（直線）で まひ', 'ゴロゴロ…ピシャーン！'],
        ['092', 'watageboushi', 'ワタゲボウシ', 'かぜ', '★3', 'にげる', 'すぐ逃げる。たおすと 良い道具を落とす', 'ふわふわ～']
    ];
    const BOSS = ['', 'maoushin', '大魔王ASO・真', 'ふしぎ', 'ボス', '近づく', 'HP が減ると 四天王（ダイシ・ズミタニ・ルナヤ・ノゾエマ）を 1 人ずつ呼ぶ', 'まだだ……真の力を 見せてやろう！'];
    // 元の敵の名前 (進化形の「元」に出す)
    const BASE_NAMES = {
        haribaby: 'ハリベビー', mumenbachi: 'ムメンキョバチ', donguriko: 'ドングリコ', nemuridake: 'ネムリダケ', pekorisu: 'ペコリス',
        tsutankobu: 'ツタンコブ', yofukashi: 'ヨフカシフクロウ', kogame: 'コガメ', otohimedai: 'オトヒメダイ', umibozun: 'ウミボウズン',
        enjoubouzu: 'エンジョウボウズ', spamdama: 'スパムダマ', rousokubi: 'ロウソクビ', geninman: 'ゲニンマン', kawarimidanuki: 'カワリミダヌキ',
        bakudanjirou: 'バクダンジロウ', tsukiusagi: 'ツキウサギ', mangetsuwolf: 'マンゲツウルフ', yukimidango: 'ユキミダンゴ',
        proteingolem: 'プロテインゴーレム', magmatcho: 'マグマッチョ', yukidarumuscle: 'ユキダルマッスル', asohei: 'アソヘイ',
        takaramimic: 'タカラミミック', koorimodoki: 'コオリモドキ', shakkinbourei: 'シャッキンボウレイ', daichouenkin: 'ダイチョウエンキン', maou: '大魔王ASO'
    };

    const { Art: A, BigArt: B, EnemyArt9: E } = KD;
    const sprites = [];   // { canvas, id, scale } (アニメーションで描き直す)

    function makeCanvas(id, scale) {
        const size = A.SPRITES[id] ? { w: 16, h: 16 } : B.BIG[id];
        const c = document.createElement('canvas');
        c.width = size.w * scale;
        c.height = size.h * scale;
        sprites.push({ canvas: c, id, scale, h: size.h });
        return c;
    }
    function draw(s, frame) {
        const ctx = s.canvas.getContext('2d');
        ctx.clearRect(0, 0, s.canvas.width, s.canvas.height);
        if (A.SPRITES[s.id]) A.drawSprite(ctx, s.id, frame, 0, 0, { scale: s.scale });
        else B.drawBig(ctx, s.id, frame, s.canvas.width / 2, s.canvas.height, { height: s.h * s.scale });
    }

    function card(row, parent, scale = 5) {
        const [no, id, name, element, star, ai, trait, line] = row;
        const el = document.createElement('div');
        el.className = 'card';
        const pics = document.createElement('div');
        pics.className = 'pics';
        const base = E.EVOLVED[id];
        if (base) {
            const from = makeCanvas(base, base === 'maou' ? 1 : 3);
            from.className = 'from';
            from.title = BASE_NAMES[base] || base;
            pics.append(from);
            const arrow = document.createElement('span');
            arrow.className = 'arrow';
            arrow.textContent = '▶';
            pics.append(arrow);
        }
        pics.append(makeCanvas(id, scale));
        el.append(pics);
        const color = ELEMENT_COLORS[element];
        el.insertAdjacentHTML('beforeend', `
            <div class="head"><span class="no">${no ? 'No.' + no : ''}</span><span class="name">${name}</span></div>
            <div class="tags"><span class="tag" style="background:${color}">${element}</span><span class="tag plain">${star}</span><span class="tag plain">${ai}</span>
                ${base ? `<span class="tag plain">元: ${BASE_NAMES[base] || base}</span>` : ''}</div>
            <div class="desc">${trait}</div>
            <div class="line">「${line}」</div>`);
        parent.append(el);
        return el;
    }

    // ?from=53&to=64 で その番号だけ (確認用。ボスは 0)
    const q = new URLSearchParams(location.search);
    const from = Number(q.get('from') || 0), to = Number(q.get('to') || 999);
    if (from <= 0) card(BOSS, document.getElementById('boss'), 2).classList.add('boss');
    LIST.filter(row => Number(row[0]) >= from && Number(row[0]) <= to)
        .forEach(row => card(row, document.getElementById(Number(row[0]) <= 79 ? 'evolved' : 'native')));

    let frame = 0;
    const tick = () => { sprites.forEach(s => draw(s, frame)); frame = 1 - frame; };
    tick();
    setInterval(tick, 450);
})();
</script>
</body>
</html>
