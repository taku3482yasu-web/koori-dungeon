<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1420">
<!-- ホーム画面に 追加 (アプリ化。manifest.webmanifest / sw.js。2026-10-25 ユーザー指定) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>こおりくんの大冒険～ダンジョンドタバタ大道中～</title>
<link rel="stylesheet" href="css/style.css?v=caf1fb76">
</head>
<body>
<main class="app">
    <h1>こおりくんの大冒険<small>～ダンジョンドタバタ大道中～</small><a class="howto" href="howto.html" target="_blank" rel="noopener">遊び方</a></h1>
    <div class="stage">
        <canvas id="screen" aria-label="ダンジョン"></canvas>
        <div id="ask" class="ask" hidden>
            <p class="ask-text"></p>
            <div class="ask-choices"></div>
        </div>
    </div>
    <!-- ダンジョンの外 (タイトル・町・ストーリー) では、聞く画面を ここへ 移す (ゲーム画面に 重ねない。main.js) -->
    <div id="ask-slot" class="ask-slot"></div>
    <!-- わざ (キーボードは 1〜6。5・6 は ストーリーを クリアした 主人公)。main.js が作る -->
    <div id="skills" class="skills" aria-label="わざ"></div>
    <!-- スマホの操作 (仕様書 15章)。十字ボタンは長押しでダッシュ -->
    <div class="pad" aria-label="操作">
        <div class="dpad">
            <button type="button" data-dir="-1,-1" aria-label="左上">↖</button>
            <button type="button" data-dir="0,-1" aria-label="上">↑</button>
            <button type="button" data-dir="1,-1" aria-label="右上">↗</button>
            <button type="button" data-dir="-1,0" aria-label="左">←</button>
            <span></span>
            <button type="button" data-dir="1,0" aria-label="右">→</button>
            <button type="button" data-dir="-1,1" aria-label="左下">↙</button>
            <button type="button" data-dir="0,1" aria-label="下">↓</button>
            <button type="button" data-dir="1,1" aria-label="右下">↘</button>
        </div>
        <div class="acts">
            <button type="button" id="btn-ok">攻撃・決定</button>
            <button type="button" id="btn-item">道具</button>
            <button type="button" id="btn-tactic">作戦</button>
            <button type="button" id="btn-switch">交代</button>
            <button type="button" id="btn-special">必殺技</button>
            <button type="button" id="btn-wait">足ぶみ</button>
            <button type="button" id="btn-map">地図</button>
            <button type="button" id="btn-sound">音</button>
            <button type="button" id="btn-status">ステータス</button>
            <button type="button" id="btn-down" hidden>下の階へ</button>
        </div>
    </div>
    <p class="keys">移動：矢印キー・テンキー（斜めは矢印を2つ同時か、Shift を押しながら）／ダッシュ：B を押しながら移動／向きだけ変える：R を押しながら方向／攻撃・決定：Z・Enter（階段の上なら降りる）／わざ：1〜4（ストーリーをクリアした主人公は 1〜6）／道具：X／仲間の作戦：T／操作するキャラの交代：C／必殺技：V（1 人 1 回・チームで 3 回）／足ぶみ：Space／戻る：X・Esc／ステータス・装備：E／ミニマップ：M／下の階へ（階段を見つけたら いつでも）：D／音のオン・オフ：S（「音」ボタンで 音量）</p>
</main>
